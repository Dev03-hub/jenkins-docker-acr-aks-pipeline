apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java
  template:
    metadata:
      labels:
        app: java
    spec:
      containers:
        - name: java-app
          image: myjavapp.azurecr.io/repo1:app1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080